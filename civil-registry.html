<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบทะเบียนราษฎร์</title>
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#12303b;--mute:#58707a;--line:#c9d6d3;--panel:#fff;--seal:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--ink:#e6f0ee;--mute:#9ab0b3;--line:#2a3f44;--panel:#16272c}}
:root[data-theme="dark"]{--bg:#0f1c20;--ink:#e6f0ee;--mute:#9ab0b3;--line:#2a3f44;--panel:#16272c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Sarabun,"Noto Sans Thai",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font:800 clamp(28px,5vw,44px)/1.15 K2D,Sarabun,sans-serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.tools input{flex:1 1 280px}
:focus-visible{outline:3px solid #2a8f9b;outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.count{color:var(--mute);font-size:14px;margin:0 0 8px}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;width:100%}
.row[aria-current=true]{border-left-color:var(--seal);background:color-mix(in srgb,var(--panel) 88%,#bfe3df)}
.row b{font-weight:600}.row small{color:var(--mute)}
.tag{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--seal);border:1px solid var(--seal);border-radius:99px;padding:0 8px}
.side{position:sticky;top:16px}
.idc{color:#12303b;border-radius:14px;padding:16px;background:repeating-radial-gradient(circle at 85% 20%,#ffffff55 0 2px,transparent 2px 9px),linear-gradient(135deg,#bfe3df,#e9dff0 55%,#f4c9d4);box-shadow:0 1px 0 #fff8 inset,0 6px 18px #12303b33}
.idc h2{font:600 15px/1.3 K2D,Sarabun,sans-serif;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.no{font:800 22px/1.2 K2D,sans-serif;letter-spacing:.04em;margin:0 0 10px}
.body{display:grid;grid-template-columns:1fr 96px;gap:12px}
.ph{aspect-ratio:3/4;background:#ffffff88;border:1px dashed #12303b66;border-radius:6px;display:grid;place-items:center;font-size:12px;text-align:center;color:#12303b99}
.k{font-size:12px;color:#12303bb3;margin:8px 0 0}.v{margin:0;font-weight:600}
.meta{margin-top:12px;font-size:13px;color:var(--mute)}
.warn{margin-top:10px;border:1px solid var(--seal);color:var(--seal);border-radius:8px;padding:8px 12px;font-size:14px}
.empty{padding:24px;border:1px dashed var(--line);border-radius:8px;color:var(--mute)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{position:static;order:-1}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.b.o{background:transparent;color:var(--ink)}button.b.d{background:transparent;color:var(--seal);border-color:var(--seal)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:grid;font-size:14px;color:var(--mute);gap:2px}.fg .w{grid-column:1/-1}
.fg input,.fg select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.err{color:var(--seal);margin:8px 0 0;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
<h1>ระบบทะเบียนราษฎร์</h1>
<p class="sub">ค้นหาข้อมูลบุคคลและที่อยู่ตามทะเบียนบ้าน</p>
<div class="tools">
<input id="q" type="search" placeholder="ค้นด้วยเลขบัตร ชื่อ นามสกุล หรือที่อยู่" aria-label="ค้นหา">
<button class="b" id="add" hidden>เพิ่มบุคคล</button><select id="pv" aria-label="จังหวัด"><option value="">ทุกจังหวัด</option></select>
</div>
<div class="grid">
<div><p class="count" id="cnt" aria-live="polite"></p><div class="list" id="list"></div></div>
<aside class="side" id="side" aria-live="polite"></aside>
</div>
</div>
<dialog id="dlg"><h2 id="dt" style="margin:0 0 12px;font:600 20px K2D,Sarabun,sans-serif"></h2><div class="fg" id="fg"></div><p class="err" id="er" role="alert"></p><div class="bar"><button class="b" id="sv">บันทึก</button><button class="b o" id="cx">ยกเลิก</button></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=[["id","เลขบัตรประจำตัวประชาชน","w"],["p","คำนำหน้า"],["s","เพศ"],["f","ชื่อ"],["l","นามสกุล"],["d","วันเกิด เช่น 14 มกราคม 2538","w"],["h","บ้านเลขที่"],["r","หมู่ที่ / ซอย / ถนน"],["t","ตำบล / แขวง"],["u","อำเภอ / เขต"],["v","จังหวัด","w"]];
$("#fg").innerHTML=F.map(([k,t,w])=>`<label class="${w||""}">${t}${k==="s"?`<select id="f_s"><option>ชาย</option><option>หญิง</option></select>`:`<input id="f_${k}" autocomplete="off">`}</label>`).join("");
let D=[],cnt={},sel=null,db=null,me=null,canW=false,edit=null,arm=false,ready=false;
const pv=$("#pv");
function prep(){cnt={};D.forEach(x=>cnt[x.id]=(cnt[x.id]||0)+1);
D.forEach(x=>{x.name=((x.p||"")+" "+(x.f||"")+" "+(x.l||"")).replace(/\s+/g," ").trim();x.flag=cnt[x.id]>1?"เลขซ้ำ":!x.l?"ไม่มีนามสกุล":"";
x.addr=[x.h,x.r,x.t,x.u,(x.v||"").startsWith("กรุงเทพ")?x.v:"จังหวัด"+x.v].filter(Boolean).join(" ");
x.key=(x.id.replace(/-/g,"")+" "+x.id+" "+x.name+" "+x.addr).toLowerCase()});
const cur=pv.value;pv.length=1;[...new Set(D.map(x=>x.v))].sort((a,b)=>a.localeCompare(b,"th")).forEach(v=>pv.add(new Option(v,v)));pv.value=[...pv.options].some(o=>o.value===cur)?cur:""}
function draw(){
const q=$("#q").value.trim().toLowerCase().replace(/\s+/g," "),p=pv.value,qq=q.replace(/-/g,"");
const R=D.filter(x=>(!p||x.v===p)&&(!q||x.key.includes(q)||x.key.includes(qq)));
$("#cnt").textContent=ready?"พบ "+R.length+" จาก "+D.length+" รายการ":"กำลังโหลดข้อมูล";
if(!R.some(x=>x.dbid===sel)&&R.length)sel=R[0].dbid;
$("#list").innerHTML=R.length?R.map(x=>`<button class="row" data-n="${x.dbid}" aria-current="${x.dbid===sel}"><b>${esc(x.name)}</b><small>${esc(x.id)} · ${esc(x.v)}</small>${x.flag?`<span class="tag">${x.flag}</span>`:""}</button>`).join(""):`<div class="empty">${!ready?(db?"กำลังโหลดข้อมูล":"ต้องเข้าสู่ระบบ claude.ai เพื่อดูและแก้ไขข้อมูลร่วมกัน"):D.length?"ไม่พบรายการที่ตรงกับคำค้น ลองตรวจตัวสะกดหรือเลือก “ทุกจังหวัด”":"ยังไม่มีข้อมูล เลือก “เพิ่มบุคคล” เพื่อบันทึกรายการแรก"}</div>`;
const x=D.find(y=>y.dbid===sel);
$("#side").innerHTML=R.length&&x?`<div class="idc"><h2><span>บัตรประจำตัวประชาชน</span><span>Thai National ID Card</span></h2>
<p class="no">${esc(x.id)}</p><div class="body"><div>
<p class="k">ชื่อตัวและชื่อสกุล</p><p class="v">${esc(x.name)}</p>
<p class="k">เกิดวันที่ · เพศ</p><p class="v">${esc(x.d)} · ${esc(x.s)}</p>
<p class="k">สัญชาติ</p><p class="v">ไทย</p>
<p class="k">ที่อยู่</p><p class="v">${esc(x.addr)}</p></div><div class="ph">ไม่มีรูปบัตร</div></div></div>
${x.flag==="เลขซ้ำ"?`<div class="warn">เลขบัตรนี้ซ้ำกับอีก ${cnt[x.id]-1} รายการ ควรตรวจสอบและแก้ไข</div>`:""}
${x.flag==="ไม่มีนามสกุล"?`<div class="warn">รายการนี้ไม่มีนามสกุล ควรตรวจสอบข้อมูล</div>`:""}
<p class="meta">ลำดับที่ ${x.n} · ผู้บันทึก ${esc(x.by)}</p>
${canW?`<div class="bar"><button class="b o" id="ed">แก้ไข</button><button class="b d" id="rm">${arm?"ยืนยันลบรายการนี้":"ลบ"}</button></div>`:""}`:"";
}
function open_(x){edit=x||null;$("#dt").textContent=x?"แก้ไขข้อมูลบุคคล":"เพิ่มบุคคล";F.forEach(([k])=>$("#f_"+k).value=x?x[k]||"":(k==="s"?"ชาย":""));$("#er").textContent="";$("#dlg").showModal()}
async function save(){
const o={};F.forEach(([k])=>o[k]=$("#f_"+k).value.trim());
const dg=o.id.replace(/\D/g,"");
if(dg.length!==13){$("#er").textContent="เลขบัตรต้องมี 13 หลัก";return}
if(!o.f||!o.v||!o.d){$("#er").textContent="กรอกชื่อ วันเกิด และจังหวัดให้ครบ";return}
o.id=`${dg[0]}-${dg.slice(1,5)}-${dg.slice(5,10)}-${dg.slice(10,12)}-${dg[12]}`;
o.by=me.name||"เจ้าหน้าที่";o.n=edit?edit.n:Math.max(0,...D.map(x=>x.n))+1;
const id=edit?edit.dbid:"p"+Date.now();
try{await db.collection("people").doc(id).set(o);sel=id;$("#dlg").close()}catch(e){$("#er").textContent="บันทึกไม่สำเร็จ: "+(e.message||"ลองใหม่อีกครั้ง")}}
$("#list").addEventListener("click",e=>{const b=e.target.closest(".row");if(b){sel=b.dataset.n;arm=false;draw()}});
$("#side").addEventListener("click",async e=>{const x=D.find(y=>y.dbid===sel);
if(e.target.id==="ed")open_(x);
if(e.target.id==="rm"){if(!arm){arm=true;draw();return}arm=false;try{await db.collection("people").doc(sel).delete()}catch(_){}}});
$("#add").onclick=()=>open_();$("#sv").onclick=save;$("#cx").onclick=()=>$("#dlg").close();
$("#q").addEventListener("input",draw);pv.addEventListener("change",draw);draw();
(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(!db)return draw();
me=u?await u.me():{name:""};canW=u?(await u.can("data.write"))!==false:false;$("#add").hidden=!canW;
db.collection("people").onSnapshot(s=>{D=s.docs.map(d=>({...d.data(),dbid:d.id})).sort((a,b)=>a.n-b.n);ready=true;prep();draw()},()=>draw())}catch(_){draw()}})();
</script>
</body>
</html>
